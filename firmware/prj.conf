# Siri Remote -> Control4 bridge firmware (ESP32-S3, Zephyr).

CONFIG_LOG=y
CONFIG_SIRI_REMOTE=y

# --- Bluetooth LE central (the remote side) ---
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
# Hold a whole 101-byte notification (PROTOCOL.md §7).
CONFIG_BT_L2CAP_RX_MTU=110
CONFIG_BT_BUF_ACL_RX_SIZE=120
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=6

# --- WiFi (the Control4 side) ---
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_WIFI_NM=y
# SoftAP for first-boot provisioning + STA for normal operation.
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y   # serve the provisioning AP
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y

# --- mDNS advertise + HTTP server (web UI / status / discovery) ---
CONFIG_MDNS_RESPONDER=y
CONFIG_MDNS_RESPONDER_DNS_SD=y   # DNS-SD service advertising
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_CLIENT=y             # POST commands to the Control4 target

# --- persistent settings (WiFi creds, room, target, button map) ---
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# --- audio (voice) ---
# A1962 relays Opus with no codec. A1513 needs Speex->Opus (heavy); gated off
# by default until benchmarked on an S3 - see Kconfig SIRI_BRIDGE_TRANSCODE.

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NET_BUF_DATA_SIZE=256
