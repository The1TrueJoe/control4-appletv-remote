[package]
name = "siri-c4d"
description = "Bridge Apple TV Siri Remotes to a Control4 room via the Room Control Webhook driver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

build = "build.rs"

[[bin]]
name = "siri-c4d"
path = "src/main.rs"

[dependencies]
siri-remote = { git = "https://github.com/The1TrueJoe/siri-remote", tag = "v0.2.0", features = ["opus", "speex", "bluez"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "fs"] }
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.7", features = ["trace"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# HTTP only: the Control4 driver speaks plain HTTP on the LAN, so no TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
futures-util = "0.3"
async-stream = "0.3"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Advertise the bridge over mDNS so the Control4 driver can discover it.
mdns-sd = "0.13"
